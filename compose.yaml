name: deadmans-switch
services:
  db:
    image: ghcr.io/tursodatabase/libsql-server:v0.24.32
    platform: linux/amd64
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SQLD_NODE: primary
    volumes:
      - libsql-data:/var/lib/sqld
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /health HTTP/1.0\r\n\r\n" >&3; read -r response <&3; [[ "$$response" == *"200"* ]]'
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  libsql-data:
